version: 2

sources:
  - name: raw
    description: Raw landing schema. Text-typed mirrors of source APIs.
    schema: raw
    tables:
      - name: prices_raw
        description: yfinance OHLCV daily bars
      - name: income_statement_raw
        description: FMP quarterly income statement
      - name: balance_sheet_raw
        description: FMP quarterly balance sheet
      - name: cash_flow_raw
        description: FMP quarterly cash flow
      - name: news_raw
        description: FMP /stable/news/stock articles with body text
      - name: press_raw
        description: FMP /stable/news/press-releases with body text
      - name: sec_10k_raw
        description: SEC EDGAR 10-K Item 1A Risk Factors
      - name: sec_8k_raw
        description: SEC EDGAR 8-K material events
      - name: ingest_log
        description: Per-write audit table with sha256 checksums

  - name: silver_python
    description: Silver tables built by Python sub-pipelines (FinBERT scoring, chunking, embeddings).
    schema: silver
    tables:
      - name: silver_news_scored
        description: News articles + FinBERT scalar score in [-1, +1]
      - name: silver_press_scored
        description: Press releases + FinBERT scalar score
      - name: silver_filings_10k_chunked
        description: 10-K Item 1A text chunked (500 tokens, 50 overlap) with 384-dim embedding
      - name: silver_filings_8k_chunked
        description: 8-K text chunked + embedded

  - name: gold_python
    description: Gold tables written by Python (Streamlit RAG app, ML training, backtest).
    schema: gold
    tables:
      - name: fct_rag_queries
        description: One row per RAG answer with cited top-k chunk_ids (text array), llm_model, latency_ms, tokens, response.
