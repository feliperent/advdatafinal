advdatafinal:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', '127.0.0.1') }}"
      port: "{{ env_var('PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('PG_USER', 'postgres') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      dbname: "{{ env_var('PG_DATABASE', 'advdatafinal') }}"
      schema: public
      threads: 4
