# Databricks Job chaining the DLT pipeline (pipelinedatos.sql) and the ML notebook (mlpipeline.py).
# Create the DLT pipeline first (workflow UI or CLI), paste its id below, then submit this YAML.

resources:
  jobs:
    advdatafinal_pipeline:
      name: advdatafinal-pipeline
      description: Medallion DLT + ML notebook (FinBERT, MiniLM, PCA, 3 rungs, backtest).

      git_source:
        git_url: https://github.com/feliperent/advdatafinal
        git_provider: gitHub
        git_branch: main

      tasks:
        - task_key: data_pipeline
          description: DLT pipeline | raw / datos_masked / silver / gold.dim_*
          pipeline_task:
            pipeline_id: a6365b9a-54c9-454b-aed9-d529739b31db
            full_refresh: false
          timeout_seconds: 1800

        - task_key: ml_pipeline
          description: FinBERT + MiniLM + PCA + 3 rungs + backtest
          notebook_task:
            notebook_path: appendix/mlpipeline.py
            source: GIT
          timeout_seconds: 3600
          depends_on:
            - task_key: data_pipeline
          new_cluster:
            spark_version: 14.3.x-cpu-ml-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0
            data_security_mode: SINGLE_USER

      schedule:
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - lfrenteria33@gmail.com
