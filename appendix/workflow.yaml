## Databricks Job (workflow) | chains 01_data_pipeline -> 02_ml_pipeline
##
## Upload both notebooks to your workspace under /Repos/<user>/advdatafinal/appendix/,
## then create a Job from this YAML via:
##   databricks jobs create --json-file appendix/workflow.yaml
##
## Or paste the contents into the Databricks UI "Jobs & Pipelines" -> "Create Job" -> "Edit JSON".

resources:
  jobs:
    advdatafinal_pipeline:
      name: advdatafinal-pipeline
      description: |
        Full medallion + ML pipeline for the IN014 final project.
        Stage 1 (DLT data pipeline) builds raw/datos_masked/silver/gold tables.
        Stage 2 (ML notebook) trains 3 model rungs and writes predictions + backtest.

      tasks:
        # Stage 1: data pipeline (DLT)
        - task_key: data_pipeline
          description: Medallion DLT pipeline (raw -> datos_masked -> silver -> gold)
          notebook_task:
            notebook_path: /Repos/<user>/advdatafinal/appendix/01_data_pipeline
          timeout_seconds: 1800  # 30 min
          max_retries: 0
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge   # adjust to your Free Edition allowed types
            num_workers: 0            # single-node cluster sufficient for 25k rows

        # Stage 2: ML pipeline (depends_on stage 1)
        - task_key: ml_pipeline
          description: Train Rung 0/1/2 + write predictions + backtest
          notebook_task:
            notebook_path: /Repos/<user>/advdatafinal/appendix/02_ml_pipeline
          timeout_seconds: 3600  # 1 hour
          depends_on:
            - task_key: data_pipeline
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 0
            # ML-Runtime image for built-in xgboost + mlflow
            data_security_mode: SINGLE_USER

      schedule:
        # Optional: nightly refresh at 03:00 UTC. Comment out for ad-hoc runs.
        # quartz_cron_expression: "0 0 3 * * ?"
        # timezone_id: UTC
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - felipe@bookline.ai
