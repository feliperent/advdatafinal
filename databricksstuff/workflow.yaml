# Databricks Job chaining the DLT pipeline (pipelinedatos.sql) and the ML notebook (mlpipeline.py).
# Create the DLT pipeline first (workflow UI or CLI), paste its id below, then submit this YAML.

resources:
  jobs:
    advdatafinal_pipeline:
      name: advdatafinal-pipeline
      description: Medallion DLT + ML notebook (FinBERT, MiniLM, PCA, 3 rungs, backtest).

      git_source:
        git_url: https://github.com/feliperent/advdatafinal
        git_provider: gitHub
        git_branch: main

      tasks:
        - task_key: data_pipeline
          description: DLT pipeline | raw / datos_masked / silver / gold.dim_*
          pipeline_task:
            pipeline_id: a6365b9a-54c9-454b-aed9-d529739b31db
            full_refresh: false
          timeout_seconds: 1800

        - task_key: ml_pipeline
          description: FinBERT scoring + MiniLM chunking + PCA + 2 XGBoost rungs + backtest
          notebook_task:
            notebook_path: /Workspace/Repos/lfrenteria33@gmail.com/advdatafinal/databricksstuff/mlpipeline
          # MiniLM embedding of 14k chunks on serverless CPU takes ~45 min; FinBERT + train + backtest add another ~10 min.
          timeout_seconds: 5400
          depends_on:
            - task_key: data_pipeline
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            client: "2"

      schedule:
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - lfrenteria33@gmail.com
